name: dry-run

# Manual rehearsal of the whole pipeline. Reads SET news like an ordinary visitor,
# publishes the report (not the state) to the `data` branch, and never sends LINE messages.
# Without an ANTHROPIC_API_KEY secret it runs with AI summaries off (original-text excerpts).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dry run
        run: node src/main.js --dry-run --capture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
